<svg xmlns="http://www.w3.org/2000/svg" width="12" height="15" viewBox="0 0 12 15" shape-rendering="crispEdges">
<!--
  Hand cursor, drawn at 1:1 so it stays pixel-sharp at any zoom. Generated from this
  grid, where # is the black outline, . is the white fill and · is transparent:

     ···###······
     ···#.#······
     ···#.#······
     ···#.#······
     ···#.#······
     ···#.######·
     ··##......#·
     ·#........#·
     ·#........#·
     ·#........#·
     ··#.......#·
     ··#.......#·
     ···#......#·
     ···#.....#··
     ····######··
-->
  <rect x="3" y="0" width="3" height="1" fill="#000000"/>
  <rect x="3" y="1" width="1" height="1" fill="#000000"/>
  <rect x="4" y="1" width="1" height="1" fill="#ffffff"/>
